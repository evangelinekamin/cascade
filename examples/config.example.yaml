# Example Cascade configuration
# Copy to ~/.config/cascade/config.yaml and set your API keys

providers:
  gemini:
    enabled: true  # Change to true and set API key below
    api_key: ${GEMINI_API_KEY}
    model: gemini-2.0-flash
    temperature: 0.7
    max_tokens: 2048
  
  claude:
    enabled: true  # Change to true and set API key below
    api_key: ${CLAUDE_API_KEY}
    model: claude-3-5-sonnet-20241022
    temperature: 0.7
    max_tokens: 2048

  openrouter:
    enabled: true
    api_key: ${OPENROUTER_API_KEY}
    model: qwen/qwen3.5-9b
    fast_model: stepfun/step-3.7-flash
    fallback_model: minimax/minimax-m2.5
    temperature: 0.7

defaults:
  provider: gemini
  theme: deep-stream

# Model-selected workflow routing for ordinary prompts. Cerebras is an
# OpenRouter upstream endpoint, not a separate Cascade provider.
orchestration:
  enabled: true
  modes: [design, plan, build, test]
  router_provider: openrouter
  router_model: openai/gpt-oss-120b
  recon_provider: openrouter
  recon_model: openai/gpt-oss-120b
  fast_provider: openrouter
  fast_model: stepfun/step-3.7-flash
  provider_preferences:
    order: [cerebras]
    allow_fallbacks: true
    require_parameters: true
    # OpenRouter supports per-request privacy filtering. Uncomment either when
    # endpoint availability is less important than the stronger constraint.
    # data_collection: deny
    # zdr: true
  fast_provider_preferences:
    allow_fallbacks: true
    require_parameters: true

# Hooks receive structured JSON on stdin. Tool-call hooks fail closed by
# default, so a timeout or crash cannot silently bypass a policy hook.
hooks:
  - name: audit-shell
    event: tool_call
    if: "Bash(*)"
    command: "python3 ~/.config/cascade/hooks/audit_shell.py"
    timeout: 10
    priority: 100

# Cascade never displays a permission popup. `auto` immediately runs routine
# reads, workspace edits, and transparent dev commands, then sends ambiguous
# action metadata to a fresh tool-less model for allow/deny classification.
# Other postures: yolo (unchecked except explicit denies and root/home delete),
# safe (review every mutation), readonly (deny every mutation).
permissions:
  posture: auto
  allow: []
  deny: []
  # Legacy key name: matching actions are background-reviewed, not prompted.
  ask: []
  reviewer:
    enabled: true
    # Leave blank to reuse the orchestration/default direct API provider.
    provider: ""
    model: ""
    timeout: 10

# Before using Cascade, set your API keys:
#
# export GEMINI_API_KEY="your-gemini-key-here"
# export CLAUDE_API_KEY="your-claude-key-here"
# export OPENROUTER_API_KEY="your-openrouter-key-here"
#
# Then run:
#   cascade ask "hello world"
